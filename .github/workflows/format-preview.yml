name: Format Preview

on:
  push:
    branches:
      - phase-1/shopify-scaffold

permissions:
  contents: read

jobs:
  format-preview:
    if: contains(github.event.head_commit.message, '[format-preview]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install

      - name: Format exact failing files and emit base64
        shell: bash
        run: |
          npx prettier --write app/routes/app._index.tsx tests/scaffold-contract.test.mjs package.json vite.config.ts
          for file in app/routes/app._index.tsx tests/scaffold-contract.test.mjs package.json vite.config.ts; do
            echo "FORMATTED_FILE_BEGIN:${file}"
            base64 -w0 "${file}"
            echo
            echo "FORMATTED_FILE_END:${file}"
          done
