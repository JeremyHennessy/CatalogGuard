name: Phase 2 Ten Rule Format

on:
  push:
    branches:
      - phase-2/domain-rule-engine

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[phase2-format-10]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: phase-2/domain-rule-engine

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format exact CI failures and commit
        shell: bash
        run: |
          npx prettier --write \
            app/domain/rules/builtin/product-attributes.ts \
            tests/domain/rule-engine.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/domain/rules/builtin/product-attributes.ts \
            tests/domain/rule-engine.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "Format ten-rule Phase 2 slice"
          git push origin HEAD:phase-2/domain-rule-engine
