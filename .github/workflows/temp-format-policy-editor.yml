name: Temporary policy editor formatter

on:
  push:
    branches:
      - phase-4/policies-exceptions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format policy editor
        run: npx --no-install prettier --write 'app/routes/app.policy.$policyId.tsx'
      - name: Commit mechanical formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/routes/app.policy.$policyId.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format deterministic policy editor"
          git push origin HEAD:phase-4/policies-exceptions
