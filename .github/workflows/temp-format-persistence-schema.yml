name: Temporary persistence schema formatter

on:
  push:
    branches:
      - phase-2/domain-rule-engine

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format bounded persistence test
        run: npx --no-install prettier --write tests/persistence-schema-contract.test.mjs

      - name: Commit mechanical formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/persistence-schema-contract.test.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "Format persistence schema contract test"
          git push origin HEAD:phase-2/domain-rule-engine
