name: Temporary Phase 3 formatter

on:
  push:
    branches:
      - phase-3/baseline-dashboard

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format bounded Phase 3 slice
        run: >-
          npx --no-install prettier --write
          app/domain/policy/dev-validation-template.ts
          app/routes/app._index.tsx
          app/services/exceptions/exact-exceptions.server.ts
          tests/domain/dev-validation-policy.test.ts

      - name: Commit mechanical formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/domain/policy/dev-validation-template.ts app/routes/app._index.tsx app/services/exceptions/exact-exceptions.server.ts tests/domain/dev-validation-policy.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "Format Phase 3 baseline onboarding slice"
          git push origin HEAD:phase-3/baseline-dashboard
