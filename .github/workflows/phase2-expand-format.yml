name: Phase 2 Expansion Format

on:
  push:
    branches:
      - phase-2/domain-rule-engine

permissions:
  contents: write

jobs:
  format-and-registry-test:
    if: contains(github.event.head_commit.message, '[phase2-expand-format]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: phase-2/domain-rule-engine

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Update registry expectation and format expansion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/domain/rule-engine.test.ts")
          text = path.read_text()
          old = '''    "CG-BARCODE-001@1",
              "CG-BARCODE-002@1",
              "CG-DESC-001@1",
              "CG-MEDIA-001@1",
              "CG-PRICE-001@1",
              "CG-PRICE-002@1",
              "CG-SKU-001@1",
              "CG-SKU-002@1",
              "CG-TYPE-001@1",
              "CG-VENDOR-001@1",'''
          old = old.replace("              ", "    ")
          new = '''    "CG-BARCODE-001@1",
              "CG-BARCODE-002@1",
              "CG-CAT-001@1",
              "CG-DESC-001@1",
              "CG-MEDIA-001@1",
              "CG-OPT-001@1",
              "CG-PRICE-001@1",
              "CG-PRICE-002@1",
              "CG-SEO-001@1",
              "CG-SEO-002@1",
              "CG-SKU-001@1",
              "CG-SKU-002@1",
              "CG-TAG-001@1",
              "CG-TYPE-001@1",
              "CG-VENDOR-001@1",'''
          new = new.replace("              ", "    ")
          if old not in text:
              raise SystemExit("registry expectation block not found")
          path.write_text(text.replace(old, new, 1))
          PY

          npx prettier --write \
            app/domain/rules/builtin/seo.ts \
            app/domain/rules/builtin/category.ts \
            app/domain/rules/builtin/tags.ts \
            app/domain/rules/builtin/options.ts \
            app/domain/rules/registry.ts \
            tests/domain/additional-rules.test.ts \
            tests/domain/rule-engine.test.ts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/domain/rules/builtin/seo.ts \
            app/domain/rules/builtin/category.ts \
            app/domain/rules/builtin/tags.ts \
            app/domain/rules/builtin/options.ts \
            app/domain/rules/registry.ts \
            tests/domain/additional-rules.test.ts \
            tests/domain/rule-engine.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "Format 15-rule catalog expansion"
          git push origin HEAD:phase-2/domain-rule-engine
